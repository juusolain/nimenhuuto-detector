[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nimenhuuto-detector"
version = "0.1.0"
description = "Detect a shouted Finnish keyword and send a Telegram alert"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.26,<3",
    "python-dotenv>=1,<2",
    "sounddevice>=0.5,<1",
    "av<19"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
nimenhuuto = "nimenhuuto.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
